name: CI

# Das Repo hatte bisher keine Prüfung auf Pull Requests — ein kaputtes
# newReleases.json wäre erst beim Deploy nach dem Merge aufgefallen.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Neuheiten-Daten prüfen
        run: npm run check:releases

      - name: Build
        run: npm run build
