name: CI

# Prüfung auf Pull Requests, damit ein kaputter Build nicht erst beim Deploy
# nach dem Merge auffällt.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
